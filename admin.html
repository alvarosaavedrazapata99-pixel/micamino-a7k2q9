<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2B1A2D">
<title>Panel de Angelina</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fredoka:wght@500;600&display=swap">
<style>
:root{--bg:#FFF6F2;--surface:#fff;--ink:#2B1A2D;--muted:#6F5A70;--edge:#2B1A2D;--red:#D7263D;--on-red:#fff;--yellow:#FFC83D;--green:#2FA866;--green-soft:#D6F2E3;--red-soft:#FFDADF;--blue-soft:#DCEBFF;--yellow-soft:#FFF0C2;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1B1424;--surface:#2A2036;--ink:#FFF0F3;--muted:#C2AEC6;--edge:#6B5580;--red:#FF5C78;--on-red:#2B0E16;--yellow:#FFD25E;--green:#5DD592;--green-soft:#1D3F2F;--red-soft:#4A1E2A;--blue-soft:#1F3452;--yellow-soft:#4A3C14;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:16px;line-height:1.5;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.app{max-width:560px;margin-inline:auto;display:grid;gap:14px}
h1,h2,h3{font-family:Fredoka,system-ui,sans-serif;font-weight:600;margin:0;line-height:1.15}
h1{font-size:1.7rem}h2{font-size:1.2rem}h3{font-size:1.05rem}
.card{background:var(--surface);border:2px solid var(--edge);border-radius:20px;padding:16px;box-shadow:0 4px 0 var(--edge);min-width:0}
.sub{color:var(--muted);font-size:.92rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--edge);background:var(--red);color:var(--on-red);font:inherit;font-weight:700;border-radius:99px;padding:10px 18px;min-height:44px;cursor:pointer;box-shadow:0 3px 0 var(--edge)}
.btn.alt{background:var(--surface);color:var(--ink)}
.field{width:100%;font:inherit;color:inherit;border:2px solid var(--edge);background:var(--surface);border-radius:14px;padding:10px 12px;min-height:44px}
textarea.field{resize:vertical;min-height:90px}
label{display:block;font-weight:600;font-size:.88rem;margin:10px 0 4px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:8px;vertical-align:-1px}
.dot.on{background:var(--green)}.dot.warn{background:var(--yellow)}.dot.off{background:var(--red)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:2px solid var(--edge);border-radius:14px;padding:10px;text-align:center;background:var(--yellow-soft)}
.stat b{display:block;font-family:Fredoka,sans-serif;font-size:1.4rem;line-height:1.1}
.stat span{font-size:.75rem;color:var(--muted)}
.bars{display:flex;gap:4px;align-items:flex-end;height:90px;margin-top:10px}
.bars i{flex:1;background:var(--green);border-radius:6px 6px 0 0;min-height:3px;opacity:.9}
.bars i.z{background:var(--muted);opacity:.35}
.bl{display:flex;gap:4px;font-size:.62rem;color:var(--muted);margin-top:4px}.bl span{flex:1;text-align:center}
.entry{border:2px solid var(--edge);border-radius:14px;padding:8px 12px;margin-top:8px;background:var(--surface)}
.entry small{color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--blue-soft);margin-right:6px}
pre{white-space:pre-wrap;word-break:break-all;font-size:.78rem}
#err{color:var(--red);font-weight:600}
[hidden]{display:none!important}
</style></head><body>
<div class="app">
  <h1>Panel de Angelina</h1>
  <section class="card" id="login">
    <h2>Entrar</h2>
    <p class="sub">Escribe tu llave de administrador. Se guarda solo en este teléfono o computadora.</p>
    <label for="key">Llave</label>
    <input class="field" id="key" type="password" autocomplete="off">
    <div class="row" style="margin-top:12px"><button class="btn" id="go">Entrar</button></div>
    <p id="err"></p>
  </section>
  <div id="main" hidden style="display:grid;gap:14px"></div>
</div>
<script>
(function(){
var SB_URL='https://igqtpwuuorrmcgjttfoo.supabase.co',SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlncXRwd3V1b3JybWNnanR0Zm9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyMzY0NzgsImV4cCI6MjEwOTgxMjQ3OH0.aXBcvhTXBtCEj-L6iQGQ-jMr-Lr9OHY7rl7UneICPm4',KEY='ang-admin-key',timer=null,coachLoaded=false;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rpc(n,b){return fetch(SB_URL+'/rest/v1/rpc/'+n,{method:'POST',headers:{apikey:SB_ANON,Authorization:'Bearer '+SB_ANON,'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(function(r){if(!r.ok)throw r.status;return r.text()}).then(function(x){try{return JSON.parse(x)}catch(e){return null}})}
function ago(iso){if(!iso)return 'nunca';var m=Math.round((Date.now()-new Date(iso).getTime())/60000);if(m<1)return 'hace un momento';if(m<60)return 'hace '+m+' min';var h=Math.round(m/60);if(h<48)return 'hace '+h+' h';return 'hace '+Math.round(h/24)+' días'}
function dstat(iso){if(!iso)return 'off';var h=(Date.now()-new Date(iso).getTime())/3600000;return h<26?'on':h<72?'warn':'off'}
var FEEL={'5':'Muy bien','4':'Bien','3':'Normal','2':'Pesado','1':'Mal'};
var KIND={diario:'Diario',trabajo:'Trabajo',aprendi:'Aprendí',plan:'Lo que haré',siento:'Me siento',molesta:'Me molesta',necesito:'Necesito',gusta:'Me gusta'};
var EVL={hab:'Hábitos',gym:'Gimnasio',hap:'Cosas que la hacen feliz',reto:'Retos',rd:'Misiones del día',chk:'Check-ins',nog:'Comida sin culpa',cus:'Costumbres',dia:'Notas del diario',blk:'Pasos del horario',full:'Días completos',bel:'Cuidado personal',ex:'Extras',car:'Cardio',carx:'Cardio extra',rut:'Rutina completa',mini:'Logros pequeños',sos:'Cuidados (Me siento mal)',pho:'Fotos',voz:'Audios',ext:'Extras',pick:'Decisiones'};
var SOSN={cansada:'Cansada',triste:'Triste',agobiada:'Agobiada o con ansiedad',frustrada:'Frustrada o enojada',cuerpo:'Insegura con su cuerpo',culpa:'Con culpa por comer',sola:'Sola',nose:'No sabe, solo está mal'};
var SOSA={resp:'respirar',agua:'tomar agua',ver:'volver al presente',musica:'poner música',gata:'cariño con su gata',mov:'moverse',dormir:'descansar',esc:'escribir una frase',voz:'decirlo en voz alta',cuerpo:'3 cosas de su cuerpo',comida:'sin castigo',contar:'contártelo',bonito:'leer tu mensaje'};
function admin(){return localStorage.getItem(KEY)||''}
function render(rows){
  var m=$('main');
  if(!rows||!rows.length){m.innerHTML='<section class="card"><h2>Aún no hay datos</h2><p class="sub">Cuando Angelina abra la página y acepte guardar su progreso o compartir su actividad, aparecerá aquí.</p></section>'+coachCard();bind();return}
  var h='';
  rows.forEach(function(r){
    var s=r.summary||{},sh=r.shared||{},t=s.today||{},days=s.days||[],mx=Math.max.apply(null,days.map(function(d){return d.steps}).concat([1]));
    h+='<section class="card"><h2><span class="dot '+dstat(r.last_open)+'"></span>Última vez: '+ago(r.last_open)+'</h2><p class="sub">Se actualiza solo cada 15 segundos. Actividad hasta '+ago(r.updated_at)+'.</p></section>';
    if(!s.coins&&s.coins!==0){h+='<section class="card"><p class="sub">Ella guarda su progreso pero no compartió su actividad.</p></section>';return}
    h+='<section class="card"><h3>Hoy</h3><div class="grid" style="margin-top:10px"><div class="stat"><b>'+(t.blocksDone||0)+'/'+(t.blocksTotal||0)+'</b><span>pasos del horario</span></div><div class="stat"><b>'+(t.missionsDone||0)+'/'+(t.missionsTotal||0)+'</b><span>misiones</span></div><div class="stat"><b>'+s.streak+'</b><span>días seguidos</span></div></div></section>';
    var evs=(s.ev||[]).slice().reverse().slice(0,30);
    if(evs.length)h+='<section class="card"><h3><span class="dot on"></span>En vivo</h3><p class="sub">Lo último que hizo en la página.</p>'+evs.map(function(e){var d=new Date(e.t),td=d.toDateString()===new Date().toDateString();return '<div class="entry"><small>'+(td?'':String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' ')+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+'</small> '+esc(e.e)+'</div>'}).join('')+'</section>';
    if((sh.sos||[]).length)h+='<section class="card"><h3>Cuando se sintió mal</h3><p class="sub">Qué sentía, qué probó y cómo quedó. Lo ve porque ella compartió su diario.</p>'+sh.sos.slice().reverse().map(function(z){return '<div class="entry"><small>'+esc(z.d)+'</small> <b>'+esc(SOSN[z.f]||z.f)+'</b> · '+esc(SOSA[z.a]||z.a)+' → <b>'+esc(z.r)+'</b></div>'}).join('')+'</section>';
    var dd=(s.dd||[]).slice().reverse();
    if(dd.length)h+='<section class="card"><h3>Qué hizo cada día</h3><p class="sub">Monedas ganadas y lo que marcó, de los últimos 7 días con actividad.</p>'+dd.map(function(z){var parts=Object.keys(z.by).map(function(k){return esc(EVL[k]||k)+' ×'+z.by[k]});return '<div class="entry"><b>'+esc(z.d)+'</b> · <span class="tag">+'+z.coins+' monedas</span><br>'+parts.join(' · ')+'</div>'}).join('')+'</section>';
    h+='<section class="card"><h3>Avance</h3><div class="grid" style="margin-top:10px"><div class="stat"><b>'+s.coins+'</b><span>monedas ahora</span></div><div class="stat"><b>'+(s.earned==null?'—':s.earned)+'</b><span>ganadas en total</span></div><div class="stat"><b>'+esc(s.rank)+'</b><span>rango</span></div><div class="stat"><b>'+s.cups+'/'+s.cupsTotal+'</b><span>copas</span></div><div class="stat"><b>'+s.gym+'</b><span>entrenos</span></div><div class="stat"><b>'+s.gymWeek+'/'+s.gymPlanned+'</b><span>gym esta semana</span></div><div class="stat"><b>'+s.photos+'</b><span>fotos guardadas</span></div></div>'+
      '<div class="bars">'+days.map(function(d){return '<i class="'+(d.steps?'':'z')+'" style="height:'+Math.max(3,d.steps/mx*100)+'%" title="'+d.d+': '+d.steps+'"></i>'}).join('')+'</div><div class="bl">'+days.map(function(d){return '<span>'+d.d.slice(8)+'</span>'}).join('')+'</div><p class="sub" style="margin-top:6px">Cosas marcadas por día, últimos 14 días.</p></section>';
    if((s.gl||[]).length)h+='<section class="card"><h3>Entrenamientos</h3>'+s.gl.slice().reverse().map(function(x){return '<div class="entry"><span class="tag">'+esc(x.name)+'</span><b>'+(FEEL[x.feel]||'')+'</b>'+(x.min?' · '+x.min+' min':'')+(x.note?'<br>'+esc(x.note):'')+'<br><small>'+esc(x.d)+' · nivel '+x.lv+'</small></div>'}).join('')+'</section>';
    if((s.redeemed||[]).length)h+='<section class="card"><h3>Premios canjeados</h3>'+s.redeemed.slice().reverse().map(function(x){return '<div class="entry">'+esc(x.t)+' <small>· '+esc(x.d)+'</small></div>'}).join('')+'<p class="sub" style="margin-top:8px">Los premios los cumples tú.</p></section>';
    var lk=s.likes||{};if((lk.yes||[]).length||(lk.no||[]).length)h+='<section class="card"><h3>Comida</h3><p><b>Le gusta:</b> '+esc((lk.yes||[]).join(', ')||'—')+'</p><p><b>No quiere:</b> '+esc((lk.no||[]).join(', ')||'—')+'</p></section>';
    var mk=Object.keys(sh.mood||{}).sort().reverse();
    if(mk.length||(sh.talk||[]).length||(sh.real||[]).length){
      h+='<section class="card"><h3>Lo que ella decidió compartir</h3>';
      if(mk.length)h+=mk.slice(0,7).map(function(k){var x=sh.mood[k];return '<div class="entry"><span class="tag">'+esc(k.slice(5))+'</span><b>'+esc(x.m||'')+'</b>'+(x.n?'<br>'+esc(x.n):'')+'</div>'}).join('');
      (sh.talk||[]).slice().reverse().slice(0,12).forEach(function(x){h+='<div class="entry"><span class="tag">'+esc(KIND[x.k]||x.k)+'</span><small>'+esc(x.d)+'</small><br>'+esc(x.t)+'</div>'});
      (sh.real||[]).slice(0,12).forEach(function(x){h+='<div class="entry"><span class="tag">Lo que hizo</span><small>'+esc(x.t)+'</small><br>'+esc(x.x)+'</div>'});
      h+='</section>';
    }else h+='<section class="card"><p class="sub">Ella no compartió su diario, y está bien así.</p></section>';
    h+='<section class="card"><h3>Código de recuperación</h3><p class="sub">Si ella pierde su progreso, genera este código y mándaselo: lo pega en Yo, en "Copia de seguridad", y lo recupera.</p><div class="row" style="margin-top:10px"><button class="btn alt" data-rec="'+esc(r.device)+'">Generar código</button></div><pre id="rec"></pre></section>';
  });
  m.innerHTML=h+coachCard();bind();
}
function coachCard(){return '<section class="card"><h3>Mensaje y retos para ella</h3><p class="sub">Aparecen en su página en pocos minutos.</p><label for="cm">Mensaje en Hoy</label><textarea class="field" id="cm" placeholder="Un mensaje para ella"></textarea><label for="cd">Misiones extra de hoy (una por línea, máximo 3)</label><textarea class="field" id="cd"></textarea><label for="cw">Retos extra de la semana (una por línea, máximo 4)</label><textarea class="field" id="cw"></textarea><div class="row" style="margin-top:12px"><button class="btn" id="csave">Guardar</button><span id="cok" class="sub"></span></div></section>'}
function bind(){
  var s=$('csave');if(s)s.onclick=function(){
    var d={msg:$('cm').value.trim(),from:'Álvaro',daily:$('cd').value.split('\n').map(function(x){return x.trim()}).filter(Boolean).slice(0,3),weekly:$('cw').value.split('\n').map(function(x){return x.trim()}).filter(Boolean).slice(0,4)};
    rpc('ang_set_coach',{p_admin:admin(),p_data:d}).then(function(){$('cok').textContent='Guardado. Ella lo verá pronto.'}).catch(function(){$('cok').textContent='No se pudo guardar.'});
  };
  [].forEach.call(document.querySelectorAll('[data-rec]'),function(b){b.onclick=function(){
    rpc('ang_admin_backup',{p_admin:admin(),p_device:b.dataset.rec}).then(function(bk){
      if(!bk){$('rec').textContent='Todavía no hay copia guardada.';return}
      $('rec').textContent='ANGELINA1:'+btoa(unescape(encodeURIComponent(JSON.stringify(bk))));
    }).catch(function(){$('rec').textContent='No se pudo generar.'});
  }});
  if(!coachLoaded){coachLoaded=true;rpc('ang_get_coach',{}).then(function(r){var d=r&&r.data||{};if($('cm'))$('cm').value=d.msg||'';if($('cd'))$('cd').value=(d.daily||[]).join('\n');if($('cw'))$('cw').value=(d.weekly||[]).join('\n')}).catch(function(){})}
}
function load(){
  rpc('ang_pull',{p_admin:admin()}).then(function(rows){$('login').hidden=true;$('main').hidden=false;var act=document.activeElement&&document.activeElement.tagName;if(act==='TEXTAREA'||act==='INPUT')return;var keep={cm:$('cm')&&$('cm').value,cd:$('cd')&&$('cd').value,cw:$('cw')&&$('cw').value};render(rows);if(keep.cm!=null){$('cm').value=keep.cm;$('cd').value=keep.cd;$('cw').value=keep.cw}})
  .catch(function(){$('login').hidden=false;$('main').hidden=true;$('err').textContent='Llave incorrecta o sin conexión.';localStorage.removeItem(KEY)});
}
$('go').onclick=function(){localStorage.setItem(KEY,$('key').value.trim());$('err').textContent='';load()};
if(admin()){load()}
timer=setInterval(function(){if(admin()&&!$('main').hidden)load()},15000);
})();
</script>
</body></html>
