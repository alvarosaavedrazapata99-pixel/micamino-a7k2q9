<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF6F2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi camino">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Para Angelina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Figtree:wght@400;500;600;700&family=Fredoka:wght@500;600&family=Press+Start+2P&display=swap">
<style>
/* Layout: app de celular. Cabecera con monedas, cinco pestañas abajo (Hoy, Semana, Retos, Comer, Yo), tarjetas gruesas como de juego. */
:root{
  --bg:#FFF6F2; --surface:#FFFFFF; --ink:#2B1A2D; --muted:#6F5A70; --edge:#2B1A2D;
  --red:#D7263D; --red-soft:#FFDADF; --on-red:#FFFFFF;
  --yellow:#FFC83D; --yellow-soft:#FFF0C2;
  --blue:#3C8DF0; --blue-soft:#DCEBFF;
  --green:#2FA866; --green-soft:#D6F2E3;
  --pink-soft:#FBE3EC;
  --f-head:'Fredoka',system-ui,sans-serif; --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-px:'Press Start 2P',ui-monospace,monospace; --f-hand:'Caveat','Segoe Script',cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1424; --surface:#2A2036; --ink:#FFF0F3; --muted:#C2AEC6; --edge:#6B5580;
  --red:#FF5C78; --red-soft:#4A1E2A; --on-red:#2B0E16;
  --yellow:#FFD25E; --yellow-soft:#4A3C14;
  --blue:#6FB0FF; --blue-soft:#1F3452;
  --green:#5DD592; --green-soft:#1D3F2F;
  --pink-soft:#41233A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1424; --surface:#2A2036; --ink:#FFF0F3; --muted:#C2AEC6; --edge:#6B5580;
  --red:#FF5C78; --red-soft:#4A1E2A; --on-red:#2B0E16;
  --yellow:#FFD25E; --yellow-soft:#4A3C14;
  --blue:#6FB0FF; --blue-soft:#1F3452;
  --green:#5DD592; --green-soft:#1D3F2F;
  --pink-soft:#41233A; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3,h4{font-family:var(--f-head);font-weight:600;line-height:1.15;margin:0}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
.app{max-width:520px;margin-inline:auto}
svg.i{width:1em;height:1em;flex:none}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-head);font-size:1.15rem;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.coins{display:flex;align-items:center;gap:8px;background:var(--yellow);color:#2B1A2D;border:2px solid var(--edge);border-radius:99px;padding:5px 12px 5px 6px;box-shadow:0 3px 0 var(--edge);font-family:var(--f-px);font-size:.72rem}
.coins svg{width:24px;height:24px}

/* Pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:2px solid var(--edge);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs div{display:flex;width:100%;max-width:520px;gap:4px}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;text-decoration:none;color:var(--muted);font-size:.6rem;font-weight:600;min-width:0}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{background:var(--yellow);color:#2B1A2D}
.tabs a:focus-visible{outline:3px solid var(--ink);outline-offset:1px}

/* Tarjetas y piezas */
.view{display:grid;gap:16px;padding-top:6px}
.view.enter > *{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards}
.view.enter > *:nth-child(2){animation-delay:.07s}.view.enter > *:nth-child(3){animation-delay:.14s}.view.enter > *:nth-child(4){animation-delay:.21s}
.view.enter > *:nth-child(5){animation-delay:.28s}.view.enter > *:nth-child(n+6){animation-delay:.34s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@media (prefers-reduced-motion:reduce){.view.enter > *{animation:none}}
.card{background:var(--surface);border:2px solid var(--edge);border-radius:22px;padding:16px;box-shadow:0 4px 0 var(--edge);min-width:0}
.card.red{background:var(--red-soft)}.card.yellow{background:var(--yellow-soft)}.card.blue{background:var(--blue-soft)}.card.green{background:var(--green-soft)}.card.pink{background:var(--pink-soft)}
.card h2{font-size:1.35rem;margin-bottom:4px}
.card h3{font-size:1.1rem;margin-bottom:4px}
.sub{color:var(--muted);font-size:.93rem}
.eyebrow{font-family:var(--f-px);font-size:.6rem;letter-spacing:.04em;color:var(--red);margin-bottom:8px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--edge);background:var(--red);color:var(--on-red);font-weight:700;border-radius:99px;padding:10px 18px;min-height:44px;cursor:pointer;box-shadow:0 3px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
.btn.alt{background:var(--surface);color:var(--ink)}
.btn.yel{background:var(--yellow);color:#2B1A2D}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.tick:focus-visible,.pill:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--edge);background:var(--surface);border-radius:99px;padding:7px 14px;min-height:40px;cursor:pointer;font-weight:600;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--yellow);color:#2B1A2D}
.field{width:100%;border:2px solid var(--edge);background:var(--surface);border-radius:14px;padding:10px 12px;min-height:44px}
textarea.field{resize:vertical;min-height:76px}
label.l{display:block;font-weight:600;font-size:.88rem;margin:10px 0 4px}
.bar{height:14px;border-radius:99px;background:var(--surface);border:2px solid var(--edge);overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--red) 0 10px,var(--yellow) 10px 20px);transition:width .5s}

/* Lista de tareas */
.list{display:grid;gap:8px;margin-top:10px}
.tick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--edge);border-radius:16px;padding:10px 12px;min-height:52px;cursor:pointer}
.tick .bx{width:28px;height:28px;border-radius:9px;border:2px solid var(--edge);flex:none;display:grid;place-items:center;background:var(--surface)}
.tick .bx svg{width:18px;height:18px;opacity:0;transition:opacity .2s}
.tick[aria-pressed="true"]{background:var(--green-soft)}
.tick[aria-pressed="true"] .bx{background:var(--green)}
.tick[aria-pressed="true"] .bx svg{opacity:1}
.tick[aria-pressed="true"] .tt{color:var(--muted);text-decoration:line-through}
.tick .tt{flex:1;min-width:0;overflow-wrap:anywhere}
.tick .pt{font-family:var(--f-px);font-size:.55rem;color:var(--muted);white-space:nowrap}
.del{border:0;background:none;color:var(--muted);font-size:1.4rem;line-height:1;cursor:pointer;padding:6px 10px;min-width:40px;min-height:40px}
.itemrow{display:flex;align-items:stretch;gap:4px}
.itemrow .tick{flex:1}

/* Horario del día */
.pills{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;margin-inline:-2px}
.pill{flex:1;min-width:44px;border:2px solid var(--edge);background:var(--surface);border-radius:14px;padding:8px 0;text-align:center;cursor:pointer;font-weight:700;display:grid;gap:0;line-height:1.1}
.pill small{font-size:.62rem;font-weight:600;color:var(--muted)}
.pill[aria-pressed="true"]{background:var(--red);color:var(--on-red)}
.pill[aria-pressed="true"] small{color:var(--on-red)}
.pill.today{box-shadow:0 3px 0 var(--edge)}
.tl{display:grid;gap:8px;margin:8px 0 4px}
.blk{display:flex;gap:12px;align-items:center;border-radius:14px;padding:9px 12px;border:2px solid var(--edge)}
.blk b{font-family:var(--f-px);font-size:.55rem;min-width:84px;line-height:1.6}
.blk.work{background:var(--blue-soft)}.blk.gym{background:var(--red-soft)}.blk.free{background:var(--green-soft)}.blk.rest{background:var(--yellow-soft)}
.idea{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;margin-top:8px}
.idea svg{width:26px;height:26px;flex:none}
.add{display:flex;gap:8px;margin-top:12px}
.add .field{flex:1}

/* Rutina */
details{border:2px solid var(--edge);border-radius:16px;background:var(--surface);margin-top:10px;overflow:hidden}
summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px;min-height:48px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--f-head);font-size:1.4rem;line-height:1}
details[open] summary::after{content:"–"}
details > div{padding:0 14px 14px}
details p + p{margin-top:8px}
.ex{display:grid;gap:0}
.ex div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--edge);font-size:.95rem}
.ex div:first-child{border-top:0}
.ex span{color:var(--muted);white-space:nowrap}
.ex .x b::after{content:"extra";font-family:var(--f-px);font-size:.5rem;margin-left:8px;background:var(--yellow);color:#2B1A2D;border-radius:99px;padding:3px 7px}

/* Copa */
.track{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.ch{width:44px;height:44px;border-radius:14px;border:2px solid var(--edge);display:grid;place-items:center;background:var(--surface)}
.ch svg{width:30px;height:30px;opacity:.2;filter:grayscale(1)}
.ch.on{background:var(--red-soft)}.ch.on svg{opacity:1;filter:none}
.flag{width:44px;height:44px;border-radius:14px;border:2px solid var(--edge);background:conic-gradient(var(--ink) 25%,var(--surface) 0 50%,var(--ink) 0 75%,var(--surface) 0) 0 0/16px 16px}
.lv{font-family:var(--f-px);font-size:.62rem;line-height:1.6}
.reward{display:flex;align-items:center;gap:12px;justify-content:space-between;border:2px solid var(--edge);border-radius:16px;padding:10px 12px;background:var(--surface);flex-wrap:wrap}
.reward .nm{flex:1;min-width:140px;overflow-wrap:anywhere}
.reward .cost{font-family:var(--f-px);font-size:.6rem;display:flex;align-items:center;gap:6px}
.reward .cost svg{width:20px;height:20px}

/* Fotos */
.strip{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 12px;margin-inline:-2px;scroll-snap-type:x proximity}
.pola{flex:none;width:108px;background:var(--surface);padding:5px 5px 6px;border-radius:10px;border:2px solid var(--edge);rotate:var(--r,-2deg);scroll-snap-align:start;margin:0}
.pola img{display:block;width:100%;height:86px;object-fit:cover;border-radius:6px;background:var(--pink-soft)}
.pola figcaption{font-family:var(--f-hand);font-size:1.05rem;line-height:1;margin-top:5px;text-align:center}
.serie{display:flex;align-items:center;gap:12px;border:2px solid var(--edge);border-radius:16px;background:var(--surface);padding:8px 12px 8px 8px}
.serie img{width:48px;height:62px;object-fit:cover;border-radius:9px;flex:none;background:var(--pink-soft)}
.serie b{font-family:var(--f-head);font-weight:500}
.series{display:grid;gap:8px;margin-top:10px}

/* Plato */
.plate{display:flex;gap:14px;align-items:center}
.plate svg{width:104px;height:104px;flex:none}
.plate ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:.93rem}
.menu{display:grid;gap:10px;margin-top:10px}
.menu .d{display:grid;gap:6px;border:2px solid var(--edge);border-radius:16px;padding:10px 12px;background:var(--surface)}
.menu .d b{font-family:var(--f-head);font-weight:500}
.menu .d.now{background:var(--yellow-soft)}
.menu input{width:100%;border:0;border-bottom:2px dashed var(--edge);background:transparent;padding:6px 2px;min-height:40px}
.menu label{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.say{font-family:var(--f-hand);font-size:1.5rem;line-height:1.1}

.mood{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mood .chip{text-align:center;padding-inline:6px}
.rec{border:2px solid var(--edge);border-radius:18px;background:var(--yellow-soft);padding:14px;margin-top:8px}
.rec h3{font-size:1.15rem}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{border:2px solid var(--edge);border-radius:16px;padding:12px;background:var(--surface);display:grid;gap:8px;justify-items:start}
.opt.sel{background:var(--green-soft)}
.rb{font-family:var(--f-px);font-size:.5rem;background:var(--red);color:var(--on-red);border-radius:99px;padding:4px 8px;margin-left:6px;vertical-align:1px}
.goalrow{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-top:10px}
.flow{display:grid;gap:8px}
.step{display:grid;grid-template-columns:58px 1fr 30px;gap:10px;align-items:center;text-align:left;width:100%;border:2px solid var(--edge);border-radius:16px;background:var(--surface);padding:10px 12px;cursor:pointer;min-height:60px}
.step .tm{font-family:var(--f-px);font-size:.6rem;color:var(--muted)}
.step .bd{min-width:0;overflow-wrap:anywhere}
.step .bx{width:28px;height:28px;border-radius:50%;border:2px solid var(--edge);display:grid;place-items:center;background:var(--surface)}
.step .bx svg{width:16px;height:16px;opacity:0}
.step.now{background:var(--yellow-soft);box-shadow:0 4px 0 var(--edge)}
.step[aria-pressed="true"]{background:var(--green-soft)}
.step[aria-pressed="true"] .bx{background:var(--green)}
.step[aria-pressed="true"] .bx svg{opacity:1}
.step[aria-pressed="true"] .bd b{text-decoration:line-through;color:var(--muted)}
.step:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.vit{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media (min-width:420px){.vit{grid-template-columns:repeat(3,1fr)}}
.cupi{border:2px solid var(--edge);border-radius:18px;background:var(--surface);padding:12px 8px;display:grid;justify-items:center;text-align:center;gap:4px;align-content:start}
.cupi .em{width:76px;height:76px;display:grid;place-items:center}
.cupi .em img,.cupi .em svg{width:100%;height:100%;object-fit:contain;filter:grayscale(1);opacity:.35;transition:filter .4s,opacity .4s}
.cupi.ready .em img,.cupi.ready .em svg{filter:none;opacity:1;animation:pulse 1.2s ease-in-out infinite}
.cupi.got{background:var(--yellow-soft)}
.cupi.got .em img,.cupi.got .em svg{filter:none;opacity:1}
.cupi b{font-family:var(--f-head);font-weight:500;font-size:.95rem;line-height:1.1}
.cupi .sub{font-size:.78rem}
@keyframes pulse{50%{transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.cupi.ready .em img,.cupi.ready .em svg{animation:none}}
.sw{display:grid;gap:6px}
.real{min-height:40px;font-size:.9rem;border-style:dashed;background:transparent}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mc{width:36px;height:36px;display:grid;place-items:center}
.mc img,.mc svg{width:100%;height:100%;object-fit:contain;filter:grayscale(1);opacity:.3}
.mc.on img,.mc.on svg{filter:none;opacity:1}
.burst{position:fixed;left:50%;bottom:130px;z-index:45;pointer-events:none;width:0;height:0}
.burst svg{position:absolute;left:-14px;top:0;width:28px;height:28px;animation:coinup 1.1s ease-out forwards;opacity:0}
@keyframes coinup{0%{transform:translate(0,0) scale(.5);opacity:1}100%{transform:translate(var(--x),-190px) scale(1.15) rotate(180deg);opacity:0}}
.coins.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.25)}}
.sticker{position:fixed;left:50%;top:38%;z-index:46;pointer-events:none;width:170px;background:var(--surface);border:2px solid var(--edge);border-radius:14px;padding:6px 6px 8px;text-align:center;box-shadow:0 6px 0 var(--edge);animation:stk 2.2s ease forwards;transform:translate(-50%,-50%) rotate(-3deg)}
.sticker img{display:block;width:100%;height:130px;object-fit:cover;border-radius:8px}
.sticker span{display:block;font-family:var(--f-hand);font-size:1.3rem;line-height:1;margin-top:6px}
@keyframes stk{0%{opacity:0;transform:translate(-50%,-30%) rotate(-12deg) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) rotate(-3deg) scale(1.05)}80%{opacity:1;transform:translate(-50%,-50%) rotate(-3deg) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) rotate(4deg) scale(.9)}}
@media (prefers-reduced-motion:reduce){.sticker{animation:none;opacity:1}}
.trowrap{position:relative;width:104px;height:130px;flex:none}
.trosm .trowrap{width:76px;height:95px}
.tro{width:100%;height:100%;animation:bobt 3.2s ease-in-out infinite;overflow:visible}
@keyframes bobt{50%{transform:translateY(-5px)}}
.shn{animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(0)}60%,100%{transform:translateX(130px)}}
.spk{animation:tw 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.spk.s2{animation-delay:.6s}.spk.s3{animation-delay:1.1s}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
.cnt{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--f-px);font-size:1.1rem;color:#2B1A2D;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.trosm .cnt{font-size:.8rem}
.trobig{flex:none}
@media (prefers-reduced-motion:reduce){.tro,.shn,.spk{animation:none}}
.breath{width:130px;height:130px;margin:14px auto 6px;display:grid;place-items:center}
.breath i{display:block;width:130px;height:130px;border-radius:50%;background:var(--blue);opacity:.6;animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.55)}50%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.breath i{animation:none;transform:scale(.8)}}
.exo{border:2px solid var(--edge);border-radius:18px;background:var(--surface);padding:12px}
.exh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
button.opt{text-align:left;cursor:pointer;width:100%;font-weight:500;color:var(--ink);font-size:.95rem}
button.opt:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.listp{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.95rem}
.hr{display:flex;align-items:center;gap:8px}
.ib{width:40px;height:40px;border-radius:50%;border:2px solid var(--edge);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.ib svg{width:20px;height:20px}
.ib[aria-pressed="false"]{opacity:.45}
.ib[aria-pressed="true"]#mus{background:var(--blue);color:#fff}
.ib:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx svg{position:absolute;bottom:-60px;width:var(--s,34px);height:var(--s,34px);opacity:.22;animation:float var(--t,22s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes float{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(-120vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bgfx{display:none}}
.app{position:relative;z-index:1}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-inline:-2px}
.cats .chip{flex:none}
.tag{font-family:var(--f-px);font-size:.48rem;border-radius:99px;padding:3px 7px;margin-right:6px;vertical-align:2px;color:#2B1A2D}

.cup svg.t{width:42px;height:42px;flex:none}
.cup .in{flex:1;min-width:150px}
.cup .bar{height:10px;margin-top:6px}
.cup.done{background:var(--yellow-soft)}
.entry{border:2px solid var(--edge);border-radius:16px;background:var(--surface);padding:10px 12px;display:grid;gap:6px}
.entry .meta{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.entry p{white-space:pre-wrap;overflow-wrap:anywhere}
.k{font-family:var(--f-px);font-size:.5rem;border-radius:99px;padding:4px 8px;background:var(--blue-soft);color:var(--ink)}

a.btn{text-decoration:none}
.up{display:inline-flex}
.up input{position:absolute;opacity:0;width:1px;height:1px}
.up label{cursor:pointer}
.up input:focus-visible + label{outline:3px solid var(--ink);outline-offset:2px}
.gmine{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.gmine .m{position:relative;border:2px solid var(--edge);border-radius:16px;overflow:hidden;background:var(--pink-soft)}
.gmine .m img,.gmine .m video{display:block;width:100%;height:180px;object-fit:cover;background:#000}
.gmine .m button{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;border:2px solid var(--edge);background:var(--surface);cursor:pointer;font-size:1.2rem;line-height:1;padding:0}
.hero{display:flex;gap:14px;align-items:center}
.hero > div:last-child{min-width:0}
.av{width:64px;height:64px;border-radius:50%;background:#fff;border:2px solid var(--edge);overflow:hidden;flex:none;display:grid;place-items:end center}
.av img{width:100%;height:100%;object-fit:contain;object-position:bottom;display:block}
.av.big{width:92px;height:92px}
.av img.crop{object-fit:cover;object-position:center}
.pilots{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:10px;margin-top:12px}
.pilot{border:2px solid var(--edge);background:var(--surface);border-radius:16px;padding:6px 4px 8px;cursor:pointer;display:grid;justify-items:center;gap:4px;font-size:.72rem;font-weight:700;text-align:center;line-height:1.1}
.pilot .av{width:56px;height:56px}
.pilot[aria-pressed="true"]{background:var(--yellow);color:#2B1A2D;box-shadow:0 3px 0 var(--edge)}
.pilot:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:12px}
.gal figure{margin:0;background:#fff;border:2px solid var(--edge);border-radius:16px;height:112px;display:grid;place-items:end center;overflow:hidden;position:relative;rotate:var(--r,0deg)}
.gal img{width:100%;height:100%;object-fit:contain;object-position:bottom;display:block}
.portrait{margin:10px 0 0;border:2px solid var(--edge);border-radius:20px;overflow:hidden;background:var(--pink-soft);max-height:420px;display:grid;place-items:center}
.portrait img{display:block;width:100%;max-height:420px;object-fit:cover;object-position:center 25%}
.mine{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.mine figure,.mine .vid{margin:0;border:2px solid var(--edge);border-radius:18px;overflow:hidden;background:var(--pink-soft);position:relative}
.mine figure img,.mine video{display:block;width:100%;height:210px;object-fit:cover;object-position:center 25%;background:#000}
.mine figcaption{position:absolute;left:8px;bottom:8px;right:8px;background:var(--surface);border:2px solid var(--edge);border-radius:12px;padding:3px 10px;font-family:var(--f-hand);font-size:1.1rem;line-height:1.1;text-align:center}
.mine .wide{grid-column:1/-1}
.mine .wide img,.mine .wide video{height:240px}
.shoprow{display:flex;gap:12px;align-items:center}
.shoprow img{width:84px;height:auto;flex:none}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:40;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.share{width:100%;min-height:150px;font-size:.88rem}
.note{font-size:.82rem;color:var(--muted);margin-top:10px}

.consent{position:fixed;inset:0;z-index:60;background:rgba(20,10,25,.6);display:grid;place-items:center;padding:16px}
.consent .card{max-width:440px;max-height:92vh;overflow:auto;width:100%}
.prv{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--edge);border-radius:16px;background:var(--surface);padding:10px 12px;cursor:pointer}
.prv input{width:24px;height:24px;margin-top:2px;flex:none;accent-color:var(--red)}
.prv input:disabled + span{opacity:.5}
